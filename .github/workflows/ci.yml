name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Build
        run: bash scripts/build.sh
      - name: Lint package (Mozilla web-ext)
        run: |
          mkdir -p dist/ext && unzip -q dist/*.zip -d dist/ext
          npx --yes web-ext@8 lint --source-dir dist/ext
      - uses: actions/upload-artifact@v7
        with:
          name: want-not-extension
          path: dist/*.zip
