name: Runner image test

# One-off check that the release tooling works on a newer runner image.
# Run it from the Actions tab ("Run workflow"), then delete this file.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Runner image to test
        default: ubuntu-26.04

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Tools used by the release workflow
        run: |
          cat /etc/os-release | grep PRETTY_NAME
          zip -v | head -2
          unzip -v | head -1
          gh --version | head -1
          node --version
      - run: npm install
      - run: npm test
      - name: Build
        run: ./scripts/build.sh
      - name: Lint package (Mozilla web-ext)
        run: |
          mkdir -p dist/ext && unzip -q dist/*.zip -d dist/ext
          npx --yes web-ext@8 lint --source-dir dist/ext
      - name: Store scripts load
        run: |
          node --check scripts/chrome-publish.mjs
          node --check scripts/amo-check.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: image-test-extension
          path: dist/*.zip
      - uses: actions/download-artifact@v8
        with:
          name: image-test-extension
          path: downloaded
      - run: ls -la downloaded
