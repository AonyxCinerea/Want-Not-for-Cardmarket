name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Check tag matches manifest version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Build
        run: echo "ZIP=$(./scripts/build.sh)" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Want-Not $GITHUB_REF_NAME" --generate-notes
